<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1020">
<meta property="og:title" content="Tomorrow night, Chetna">
<meta property="og:description" content="The plan is locked in. Plus some pick-up lines you didn't ask for.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦄</text></svg>">
<title>Tomorrow Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#1a1020;
    --ink-2:#26182e;
    --line:#3d2a47;
    --text:#f6ece4;
    --muted:#bba7b4;
    --rose:#ff8fa3;
    --gold:#f3c677;
    --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
    --body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 70% at 50% 110%, #4a2340 0%, transparent 60%),
      radial-gradient(80% 50% at 85% -10%, #2f1d45 0%, transparent 60%),
      var(--ink);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--body);
    font-size:16px;line-height:1.55;
    padding-inline:16px;
    overflow-x:hidden;
  }
  #sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;
    min-height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding-block:44px;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin:0 0 12px;
  }
  h1,h2{font-family:var(--display);font-weight:400;line-height:1.05;margin:0 0 14px;text-wrap:balance}
  h1{font-size:clamp(42px,10.5vw,68px)}
  h2{font-size:clamp(32px,7.5vw,46px)}
  h1 em,h2 em{color:var(--rose)}
  p{margin:0 0 16px;color:var(--muted);max-width:60ch}
  .screen{animation:rise .6s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

  .btn{
    appearance:none;cursor:pointer;font:inherit;font-weight:600;
    border-radius:999px;padding:14px 26px;border:1px solid transparent;
    transition:transform .15s, background .2s;
  }
  .btn.primary{background:var(--rose);color:#2a0f1c}
  .btn.primary:hover{transform:scale(1.03)}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
  .btn:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}

  /* countdown */
  .clock{display:flex;gap:10px;margin:6px 0 4px}
  .clock div{
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 0;text-align:center;flex:1;
  }
  .clock b{
    display:block;font-family:var(--display);font-size:clamp(26px,8vw,38px);
    line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;
  }
  .clock span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  /* ticket */
  .ticket{margin-top:22px;background:var(--text);color:#2a1628;border-radius:18px;overflow:hidden}
  .ticket-head{
    padding:20px 22px;border-bottom:2px dashed #d9c3c9;
    display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;
  }
  .ticket-head .date{font-family:var(--display);font-size:34px;line-height:1}
  .ticket-head .who{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a5a73;font-weight:600}
  .stops{list-style:none;margin:0;padding:8px 22px 18px}
  .stops li{
    display:grid;grid-template-columns:56px 1fr 78px;gap:12px;align-items:center;
    padding:14px 0;border-bottom:1px solid #ecdde0;
  }
  .stops li:last-child{border-bottom:0}
  .stops time{font-variant-numeric:tabular-nums;font-weight:600;color:#b0476a;font-size:14px}
  .stops b{font-family:var(--display);font-weight:400;font-size:24px;display:block;line-height:1.15}
  .stops span{color:#6d5563;font-size:14px}
  .stops img{width:78px;height:78px;object-fit:cover;border-radius:10px;display:block}
  @media (max-width:360px){
    .stops li{grid-template-columns:52px 1fr}
    .stops img{display:none}
  }
  .fine{font-size:13px;color:var(--muted);margin-top:16px}

  /* pick-up lines */
  .chapter{
    font-family:var(--display);font-size:clamp(28px,6.5vw,38px);color:var(--text);
    line-height:1.1;margin-bottom:6px;
  }
  .line{
    margin:8px 0 0;padding:18px 0 4px;
    border-top:1px solid var(--line);
    font-family:var(--display);font-size:clamp(22px,5.6vw,27px);
    line-height:1.38;color:var(--text);min-height:6em;
  }
  .line::first-letter{font-size:2.1em;line-height:.9;color:var(--gold);float:left;padding:8px 8px 0 0}
  .meterbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:22px}
  .meterbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .4s}
  .meterlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}

  /* options */
  .options{display:grid;gap:10px;margin-top:20px}
  .opt{
    appearance:none;text-align:left;cursor:pointer;font:inherit;color:var(--text);
    background:var(--ink-2);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    transition:border-color .2s, transform .15s, background .2s;
  }
  .opt small{color:var(--muted);font-size:13px}
  .opt:hover{border-color:var(--rose);transform:translateY(-1px)}
  .opt.picked{background:#3a1f35;border-color:var(--rose)}
  .reaction{min-height:1.6em;margin-top:18px;font-family:var(--display);font-style:italic;font-size:22px;color:var(--gold)}

  /* weather + ask box */
  .weather{
    margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
    background:var(--ink-2);display:flex;gap:14px;align-items:center;
  }
  .wx{flex:0 0 56px;line-height:0}
  .wx-text{display:grid;gap:3px;min-width:0}
  .wx-cloud{animation:drift 5.5s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
  .wx-drop{animation:falldrop 1.1s linear infinite;transform-origin:center}
  .wx-drop.wx-d2{animation-delay:.36s}
  .wx-drop.wx-d3{animation-delay:.72s}
  @keyframes falldrop{
    0%{opacity:0;transform:translateY(-5px)}
    25%{opacity:1}
    100%{opacity:0;transform:translateY(12px)}
  }
  .wx-moon{animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
  .wx-twinkle{animation:twinkle 2.4s ease-in-out infinite}
  .wx-twinkle.wx-d2{animation-delay:.8s}
  .wx-twinkle.wx-d3{animation-delay:1.6s}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .wx-cloud,.wx-drop,.wx-moon,.wx-twinkle{animation:none}
  }
  .weather b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .weather span{font-size:15px;color:var(--text)}
  .weather .quip{color:var(--muted);font-size:14px}
  .ask-box{
    margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--ink-2);
  }
  .ask-box label{display:block;font-size:15px;color:var(--muted);margin-bottom:12px}
  .ask-box label b{color:var(--text);font-weight:600}
  .field{display:flex;gap:8px;flex-wrap:wrap}
  .field input{
    flex:1 1 180px;min-width:0;font:inherit;color:var(--text);
    background:#1d1226;border:1px solid var(--line);border-radius:999px;padding:12px 18px;
  }
  .field input::placeholder{color:#8a7684}
  .field input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .field .btn{padding:12px 22px}
  a.btn{text-decoration:none;display:inline-block}

  /* game */
  .gamehud{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    color:var(--gold);margin-bottom:10px;
  }
  .game{
    display:block;width:100%;height:min(58vh,420px);
    background:linear-gradient(180deg,#241634 0%,#3a2040 100%);
    border:1px solid var(--line);border-radius:16px;touch-action:none;cursor:grab;
  }

  /* the song */
  .song{
    margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(180deg,#2b1a33 0%,#221530 100%);
  }
  .video{
    position:relative;aspect-ratio:16/9;width:100%;max-width:100%;
    border-radius:12px;overflow:hidden;background:#000;
  }
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* fairytales — photo and story share one screen, no scrolling */
  main:has(.tale-screen){padding-block:22px}
  .tale-screen{display:flex;flex-direction:column;gap:2px}
  .tale-screen h2{font-size:clamp(26px,6.4vw,38px);margin-bottom:8px}
  .tale-screen .polaroid{
    margin:6px auto 0;width:fit-content;max-width:100%;
    padding:8px 8px 10px;
  }
  .tale-screen .polaroid img{
    max-height:44vh;width:auto;max-width:100%;object-fit:contain;margin:0 auto;
  }
  .tale-screen .polaroid figcaption{font-size:15px;margin-top:7px}
  .tale-screen .row{margin-top:14px}
  .tale{
    margin-top:14px;font-family:var(--display);font-size:clamp(17px,4.3vw,22px);
    line-height:1.4;color:var(--text);
  }
  @media (min-width:760px){
    .tale-screen .polaroid img{max-height:52vh}
  }
  @media (max-height:700px){
    .tale-screen .polaroid img{max-height:38vh}
    .tale{font-size:16px;line-height:1.35}
  }
  .tale::first-letter{font-size:2em;line-height:.9;color:var(--gold);float:left;padding:6px 8px 0 0}
  .pages{display:flex;gap:6px;margin-top:14px}
  .pages i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .pages i.on{background:var(--gold)}

  /* polaroid */
  .polaroid{
    margin:22px 0 0;padding:10px 10px 14px;background:#fbf5ef;border-radius:4px;
    transform:rotate(-1.6deg);box-shadow:0 14px 34px rgba(0,0,0,.45);max-width:100%;
  }
  .polaroid img{display:block;width:100%;height:auto;object-fit:contain;border-radius:2px}
  .polaroid figcaption{
    font-family:var(--display);font-style:italic;font-size:17px;color:#6d4a5e;
    text-align:center;margin-top:10px;line-height:1.3;
  }

  @media (prefers-reduced-motion:reduce){
    .screen{animation:none}
    *{transition:none!important}
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main id="app" aria-live="polite"></main>

<script>
(() => {
  const app = document.getElementById('app');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NAME = 'Chetna';
  const DATE = new Date(2026, 8, 26, 18, 30);   // Saturday 26 September, 6:30pm

  const TOPIC = 'chetna-date-ba0f8aef49f1';
  const notify = (title, msg, tags='sparkles') => {
    try {
      fetch('https://ntfy.sh/', {
        method:'POST', keepalive:true,
        body: JSON.stringify({ topic: TOPIC, title, message: msg, tags: tags.split(',') })
      }).catch(()=>{});
    } catch(e){}
  };
  notify('Chetna opened the page again', 'She is back on the date page.', 'eyes');

  const U = id => `https://images.unsplash.com/${id}?w=320&h=320&fit=crop&q=70&auto=format`;
  const PIC = {
    bar: U('photo-1640902106532-47dd3a2e833e'),
    dinner: U('photo-1774509621816-8c097e4f2d88'),
    view: U('photo-1583565929583-c5aa76ab16f3'),
  };

  const ticket = `
    <div class="ticket">
      <div class="ticket-head">
        <div><div class="who">Admit two · Chetna &amp; Inder</div><div class="date">Saturday 26 September</div></div>
        <div class="who">Confirmed</div>
      </div>
      <ol class="stops">
        <li><time>6:30pm</time><div><b>Bar hopping</b><span>Starting with a surprise drink, bartender's pick.</span></div><img src="${PIC.bar}" alt="A dimly lit cocktail bar" loading="lazy"></li>
        <li><time>8:30pm</time><div><b>Dinner</b><span>A table somewhere I've picked. You'll love it.</span></div><img src="${PIC.dinner}" alt="A candlelit dinner table" loading="lazy"></li>
        <li><time>10:30pm</time><div><b>A view point</b><span>City lights from up high. I'm bringing a jacket for you.</span></div><img src="${PIC.view}" alt="City lights at night" loading="lazy"></li>
      </ol>
    </div>`;

  // ---------- screen 1: the plan ----------
  function plan(){
    app.innerHTML = `<section class="screen">
      <p class="eyebrow">It's official · tomorrow night</p>
      <h1>Hi ${NAME}. <em>One sleep to go.</em></h1>
      <div class="clock" id="clock"></div>
      <p class="fine" style="margin-top:4px">until I pick you up</p>
      <div class="weather" id="weather" hidden></div>
      ${ticket}
      <p class="fine">Dress code: whatever makes you feel gorgeous. Times are flexible — you're not.</p>
      <div class="row">
        <button class="btn primary" id="go">There's more on this page</button>
        <a class="btn ghost" id="ics" download="saturday-with-inder.ics">Add to the calendar</a>
      </div>
    </section>`;
    tick(); weather(); calendarLink();
    document.getElementById('go').onclick = () => lines(0);
  }

  // live Melbourne forecast for Saturday evening
  async function weather(){
    const el = document.getElementById('weather');
    if (!el) return;
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.8136&longitude=144.9631&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Australia%2FMelbourne&start_date=2026-09-26&end_date=2026-09-26');
      const j = await r.json();
      const t = Math.round(j.hourly.temperature_2m[18]);
      const late = Math.round(j.hourly.temperature_2m[22]);
      const rain = j.hourly.precipitation_probability[18];
      const code = j.hourly.weather_code[18];
      const sky = code === 0 ? 'clear' : code <= 2 ? 'mostly clear' : code === 3 ? 'overcast'
                : code <= 48 ? 'foggy' : code <= 67 ? 'rainy' : code <= 77 ? 'snowy' : code <= 82 ? 'showery' : 'wild';
      const quip = rain >= 50 ? "Rain's likely, so I'm bringing an umbrella as well as the jacket."
                 : t <= 12 ? "Cold enough that the jacket is definitely happening."
                 : late <= 11 ? "Fine at dinner, chilly at the view point. Jacket's in the car."
                 : "Nice night for it. Jacket's coming anyway.";
      const mode = (rain >= 50 || (code >= 51 && code <= 82)) ? 'rain' : (code >= 3 && code <= 48) ? 'cloud' : 'clear';
      setSky(mode);
      el.hidden = false;
      el.innerHTML = `<div class="wx">${wxIcon(mode)}</div>
        <div class="wx-text">
          <b>Saturday, 6:30pm in Melbourne</b>
          <span>${t}° and ${sky}, dropping to ${late}° by the view point · ${rain}% chance of rain</span>
          <span class="quip">${quip}</span>
        </div>`;
    } catch(e){ /* no forecast, no problem */ }
  }

  // little animated icon for the forecast card
  function wxIcon(mode){
    if (mode === 'clear') return `<svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
      <circle class="wx-moon" cx="34" cy="28" r="13" fill="#f3c677"/>
      <circle cx="27" cy="23" r="11" fill="#26182e"/>
      <circle class="wx-twinkle" cx="16" cy="44" r="1.8" fill="#f6ece4"/>
      <circle class="wx-twinkle wx-d2" cx="49" cy="47" r="1.4" fill="#f6ece4"/>
      <circle class="wx-twinkle wx-d3" cx="44" cy="12" r="1.6" fill="#f6ece4"/>
    </svg>`;
    const drops = mode === 'rain' ? `
      <line class="wx-drop" x1="20" y1="42" x2="17" y2="50" stroke="#8fb8ff" stroke-width="3" stroke-linecap="round"/>
      <line class="wx-drop wx-d2" x1="31" y1="42" x2="28" y2="50" stroke="#8fb8ff" stroke-width="3" stroke-linecap="round"/>
      <line class="wx-drop wx-d3" x1="42" y1="42" x2="39" y2="50" stroke="#8fb8ff" stroke-width="3" stroke-linecap="round"/>` : '';
    return `<svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
      <g class="wx-cloud">
        <circle cx="24" cy="30" r="11" fill="#e7dbe6"/>
        <circle cx="38" cy="30" r="9" fill="#e7dbe6"/>
        <rect x="22" y="30" width="18" height="10" rx="5" fill="#e7dbe6"/>
      </g>
      ${drops}
    </svg>`;
  }

  // .ics so the night lands in her calendar
  function calendarLink(){
    const a = document.getElementById('ics');
    if (!a) return;
    const stamp = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0')
                 + 'T' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + '00';
    const end = new Date(2026, 8, 26, 23, 30);
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ishi//Date//EN','BEGIN:VEVENT',
      'UID:saturday-' + Date.now() + '@ishi',
      'DTSTART;TZID=Australia/Melbourne:' + stamp(DATE),
      'DTEND;TZID=Australia/Melbourne:' + stamp(end),
      'SUMMARY:Date night with Inder',
      'LOCATION:Melbourne',
      'DESCRIPTION:6:30pm bar hopping (surprise drink)\\n8:30pm dinner (my pick)\\n10:30pm the view point\\nDress code: whatever makes you feel gorgeous.',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    a.onclick = () => notify('She added it to her calendar', 'Saturday 6:30pm is officially in her phone.', 'calendar');
  }

  let clockTimer;
  function tick(){
    clearInterval(clockTimer);
    const paint = () => {
      const el = document.getElementById('clock');
      if (!el) return clearInterval(clockTimer);
      let ms = DATE - new Date();
      if (ms <= 0){ el.innerHTML = `<div style="flex:1"><b>Tonight</b><span>see you at 6:30</span></div>`; return; }
      const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60, s = Math.floor(ms/1e3)%60;
      el.innerHTML = [[d,'days'],[h,'hours'],[m,'mins'],[s,'secs']]
        .map(([v,l])=>`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
    };
    paint(); clockTimer = setInterval(paint, 1000);
  }

  // ---------- screen 2: pick-up lines ----------
  const LINES = [
    ["Are you a fairy? Because you somehow made my ordinary day feel magical. ✨🧚‍♀️",
     "And that was just a Tuesday."],
    ["If unicorns are real, then you must be the rarest one of all. 🦄💖",
     "One of one. No others in existence."],
    ["I was looking for a little magic today… then I found you. ✨",
     "Stopped looking after that."],
    ["Are you secretly a fairy princess? Because you've definitely cast a spell on me. 🧚‍♀️👑",
     "No notes. No defence. Fully under."],
    ["Forget rainbows and unicorns — I think I just found the cutest magical creature right here. 🦄🌈💕",
     "See you at 6:30, magical creature."],
  ];
  const MOOD = ['warming up','a little bit melting','smiling, I saw it','no going back now','see you at 6:30'];

  const CREATURES = ['butterfly','fairy','angel','unicorn','fairy'];

  function lines(i){
    const [text, aside] = LINES[i];
    flyBy(CREATURES[i % CREATURES.length]);
    const pct = Math.round(((i+1)/LINES.length)*100);
    const last = i === LINES.length-1;
    app.innerHTML = `<section class="screen">
      <p class="eyebrow">A little book of magic</p>
      <div class="chapter">Chapter ${i+1} of ${LINES.length}</div>
      <blockquote class="line">${text}</blockquote>
      <p class="fine" style="margin-top:6px">${aside}</p>
      <div class="meterbar"><i style="width:${pct}%"></i></div>
      <div class="meterlabel"><span>Swoon meter</span><span>${MOOD[i]}</span></div>
      <div class="row">
        <button class="btn primary" id="next">${last ? 'Close the book' : 'Turn the page'}</button>
        ${last ? '' : '<button class="btn ghost" id="skip">Skip ahead</button>'}
      </div>
    </section>`;
    document.getElementById('next').onclick = () => last ? tales(0) : lines(i+1);
    const sk = document.getElementById('skip');
    if (sk) sk.onclick = () => { notify('She skipped the pick-up lines', `Made it to line ${i+1} of ${LINES.length}.`, 'zipper_mouth_face'); tales(0); };
    if (last) notify('She read every pick-up line', `All ${LINES.length}. Swoon meter maxed out.`, 'star');
  }

  // ---------- the fairytales ----------
  const TALES = [
    { img:'tale-blue.jpg', alt:'Chetna in a pale blue suit', cap:'Exhibit A: the winter fairy',
      title:'The Winter Fairy',
      text:'In a kingdom of quiet white halls there lived a fairy who wore the winter sky. She only had to glance over her shoulder and entire conversations would stop mid-sentence. The palace blamed a draught. It was never a draught.' },

    x.save(); x.globalAlpha=a; x.translate(px,py); x.scale(s,s); x.fillStyle=col;
    x.beginPath(); x.moveTo(0,3);
    x.bezierCurveTo(-5,-2,-10,4,0,11); x.bezierCurveTo(10,4,5,-2,0,3);
    x.fill(); x.restore();
  }
  function burst(){
    const cols = ['#ff8fa3','#f3c677','#ffc2cf','#f6ece4'];
    const n = reduce ? 20 : 90;
    for (let i=0;i<n;i++) hearts.push({
      x:W/2, y:H*.55, vx:(Math.random()-.5)*9, vy:-Math.random()*10-4,
      s:Math.random()*1.4+.8, c:cols[i%cols.length], life:1
    });
  }
  // hearts wherever she taps
  addEventListener('pointerdown', e => {
    if (e.target.closest('.game')) return;            // the game has its own taps
    const cols = ['#ff8fa3','#f3c677','#ffc2cf'];
    const n = reduce ? 3 : 7;
    for (let i=0;i<n;i++) hearts.push({
      x:e.clientX, y:e.clientY, vx:(Math.random()-.5)*5, vy:-Math.random()*5-1.5,
      s:Math.random()*.8+.5, c:cols[i%cols.length], life:1
    });
  }, {passive:true});

  let t = 0;
  (function loop(){
    t += .016; x.clearRect(0,0,W,H);

    // stars — dimmed when the forecast is grey
    const starDim = 1 - wet*.65;
    for (const s of stars){
      x.globalAlpha = (reduce ? .6 : .35 + .35*Math.sin(t*1.5+s.p)) * starDim;
      x.fillStyle = '#f6ece4'; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill();
    }

    // clouds drift in when it's cloudy or raining
    if (wet > .01){
      for (const cl of clouds){
        cl.x += cl.v * (reduce ? 0 : 1);
        if (cl.x - 90*cl.s > W) cl.x = -90*cl.s;
        x.globalAlpha = .07 * wet;
        x.fillStyle = '#d9c8e6';
        x.beginPath();
        x.ellipse(cl.x, cl.y, 78*cl.s, 26*cl.s, 0, 0, 7);
        x.ellipse(cl.x + 46*cl.s, cl.y + 8*cl.s, 52*cl.s, 19*cl.s, 0, 0, 7);
        x.fill();
      }
    }

    // rain, only when rain is actually forecast
    if (skyMode === 'rain' && wet > .05 && !reduce){
      x.strokeStyle = 'rgba(160,190,255,.28)'; x.lineWidth = 1;
      x.beginPath();
      for (const d of rain){
        d.y += d.v * 16; d.x += d.v * 2.2;
        if (d.y > H){ d.y = -20; d.x = Math.random()*W; }
        x.moveTo(d.x, d.y); x.lineTo(d.x - d.l*.18, d.y - d.l);
      }
      x.stroke();
    }

    // a shooting star now and then on a clear night
    if (skyMode === 'clear' && !reduce){
      if (!shoot && Math.random() < .0015) shoot = {x: Math.random()*W*.7, y: Math.random()*H*.35, life: 1};
      if (shoot){
        shoot.x += 7; shoot.y += 2.6; shoot.life -= .012;
        x.globalAlpha = Math.max(shoot.life, 0);
        x.strokeStyle = '#f3c677'; x.lineWidth = 2; x.beginPath();
        x.moveTo(shoot.x, shoot.y); x.lineTo(shoot.x - 46, shoot.y - 17); x.stroke();
        if (shoot.life <= 0) shoot = null;
      }
    }

    wet += ((skyMode === 'clear' ? 0 : 1) - wet) * .02;
    x.globalAlpha = 1;

    // the flying couples, with a little trail of dust behind them
    for (const f of fliers){
      f.t += .016; f.x += f.vx;
      f.y += Math.cos(f.t * 2.2 + f.ph) * .9;
      const fy = f.y + Math.sin(f.t * 2.2 + f.ph) * f.amp * .12;
      if (!reduce && Math.random() < .5)
        dust.push({ x: f.x - f.vx*2, y: fy + 4, life: 1, c: f.kind === 'butterfly' ? '#ff8fa3' : '#f3c677' });
      drawFlier({ ...f, y: fy });
    }
    fliers = fliers.filter(f => f.x > -140 && f.x < W + 140);

    for (const d of dust){
      d.life -= .012; d.y += .25;
      x.globalAlpha = Math.max(d.life, 0) * .8; x.fillStyle = d.c;
      x.beginPath(); x.arc(d.x, d.y, 1.6 * d.life + .4, 0, 7); x.fill();
    }
    dust = dust.filter(d => d.life > 0);
    x.globalAlpha = 1;

    hearts = hearts.filter(h => h.life > 0);
    for (const h of hearts){
      h.x += h.vx; h.y += h.vy; h.vy += .22; h.vx *= .99; h.life -= .008;
      heart(h.x,h.y,h.s,h.c,Math.max(h.life,0));
    }
    requestAnimationFrame(loop);
  })();

  plan();
})();
</script>
</body>
</html>
